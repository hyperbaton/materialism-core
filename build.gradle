plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.74'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'materialismcore'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }

        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            programArguments.addAll('--nogui')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    // CurseForge's own maven, for compile-only access to other mods' classes without bundling
    // or hard-depending on them. Scoped to the curse.maven group only, so it doesn't slow down
    // resolution of everything else.
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseForge'
                url = 'https://cursemaven.com'
            }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // Compile-only: we mixin into TFMG's CastingBasinBlockEntity but don't want to bundle or
    // hard-depend on it. Pinned to the exact file for tfmg-1.2.0-1.21.1 (project "create-industry",
    // id 693815, file id 7430073) -- bump the file id if the target class changes upstream.
    compileOnly 'curse.maven:create-industry-693815:7430073'
    // TFMG's CastingRecipe extends Create's StandardProcessingRecipe -- needed on the compile
    // classpath just to resolve that inherited method signature, not referenced directly.
    // Pinned to create-1.21.1-6.0.10 (project id 328085, file id 7963363).
    compileOnly 'curse.maven:create-328085:7963363'
    // TFC's IHeatable interface, injected into Firmalife's oven below. Pinned to
    // TerraFirmaCraft-NeoForge-1.21.1-4.2.7 (project id 302973, file id 8566530).
    compileOnly 'curse.maven:tfc-302973:8566530'
    // Firmalife's OvenBottomBlockEntity, which we mixin into to make it implement IHeatable.
    // Pinned to Firmalife-NeoForge-1.21.1-3.0.11 (project id 453394, file id 8364676).
    compileOnly 'curse.maven:firmalife-453394:8364676'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
